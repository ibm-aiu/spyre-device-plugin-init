name: Source Code Test

on:
  workflow_dispatch:
  push:
    branches:
    - main
    paths:
    - assets/**
    - Makefile
    - Dockerfile

permissions: read-all

jobs:
  local-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Run local test
      run: make test
