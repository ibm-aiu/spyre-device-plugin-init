name: Pull Request Workflow

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: read-all

jobs:
  local-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Pre-commit
      uses: pre-commit/action@v3.0.1
    - name: Run local test
      run: make test
